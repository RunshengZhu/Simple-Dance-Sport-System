<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>{% block title %}体育舞蹈评分系统{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v=r22">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header>
  <span class="brand">体育舞蹈评分系统</span>
  <nav>
    {% block nav %}{% endblock %}
    <a href="/manual">操作手册</a>
    <span id="net-badge" class="badge" title="实时连接状态">●</span>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>window.CID = {% block cid %}0{% endblock %};</script>
<script src="/static/app.js"></script>
{% if autorefresh %}<script>
if (window.CID) { connectSSE('/api/events/' + window.CID + '/stream', {results_published: function(){location.reload();}, competition_event_opened: function(){location.reload();}, competition_event_closed: function(){location.reload();}, schedule_changed: function(){location.reload();}, score_submitted: function(){location.reload();}, calculation_done: function(){location.reload();}, screen_state_changed: function(){location.reload();}}, function(){location.reload();}, 3000); }
</script>{% endif %}
<script>
{% block scripts %}{% endblock %}
</script>
</body>
</html>
