<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}体育舞蹈评分系统{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header>
  <span class="brand">体育舞蹈评分系统</span>
  <nav>
    {% block nav %}{% endblock %}
    <span id="net-badge" class="badge" title="实时连接状态">●</span>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% if autorefresh %}<script>if (typeof CID !== 'undefined' && CID) { connectSSE('/api/events/' + CID + '/stream', {results_published: function(){location.reload();}, competition_event_opened: function(){location.reload();}, competition_event_closed: function(){location.reload();}, schedule_changed: function(){location.reload();}, score_submitted: function(){location.reload();}, calculation_done: function(){location.reload();}, screen_state_changed: function(){location.reload();}}, function(){location.reload();}, 3000); }</script>{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
