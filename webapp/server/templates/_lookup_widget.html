<div class="card lookup-hero" id="lookup-card">
  <b class="lk-title">成绩查询</b>
  <div class="lookup-row" style="margin-top:8px">
    <input id="lookup-input" placeholder="输入背番号或姓名，如 101 / 张三">
    <button class="btn" id="lookup-go" type="button">查询</button>
  </div>
  <div id="lookup-result" class="muted">可查参赛场次、晋级情况与已发布成绩。</div>
</div>
<script>
/* CID 由 base.html 的 cid block 提供（window.CID） */
function doLookup() {
  var val = document.getElementById('lookup-input').value.trim();
  var box = document.getElementById('lookup-result');
  if (!val) { box.textContent = '请输入背番号或姓名'; return; }
  var isNum = /^\d+$/.test(val);
  var url = '/api/public/events/' + window.CID + '/lookup?' + (isNum ? 'num=' : 'name=') + encodeURIComponent(val);
  fetch(url)
    .then(function (r) { if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || '查询失败'); }); return r.json(); })
    .then(function (d) {
      if (d.candidates) { renderCandidates(d.candidates); return; }
      renderResult(d);
    })
    .catch(function (e) { box.textContent = e.message; });
}
function renderCandidates(cands) {
  var box = document.getElementById('lookup-result');
  var html = '<div class="lk-cands"><p class="muted">找到 ' + cands.length + ' 位姓名匹配的选手，请选择：</p>';
  cands.forEach(function (c) {
    html += '<button class="btn small secondary lk-cand" data-num="' + c.number + '" style="margin:4px 6px 4px 0">' +
      c.number + ' ' + c.name + (c.unit ? '（' + c.unit + '）' : '') + '</button>';
  });
  html += '</div>';
  box.innerHTML = html;
  box.querySelectorAll('.lk-cand').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('lookup-input').value = b.dataset.num;
      doLookup();
    });
  });
}
function renderResult(d) {
  var box = document.getElementById('lookup-result');
  var html = '<div class="lk-profile">' +
    '<span class="lk-num">' + d.number + '</span>' +
    '<div class="lk-info"><b class="lk-name">' + d.name + '</b>' +
    (d.unit ? '<span class="muted">' + d.unit + '</span>' : '') + '</div></div>';
  if (d.projects && d.projects.length) {
    html += '<div class="lk-projects muted">参赛 ' + d.projects.length + ' 项：' + d.projects.join('、') + '</div>';
  }
  if (d.schedule && d.schedule.length) {
    html += '<div class="lk-events">';
    d.schedule.forEach(function (r) {
      var badge = '';
      if (r.status === 'published') {
        if (r.advancement === true) badge = '<span class="lk-badge lk-adv">已晋级</span>';
        else if (r.advancement === false) badge = '<span class="lk-badge lk-out">未晋级</span>';
        if (r.rank) badge += '<span class="lk-badge lk-rank">第 ' + r.rank + ' 名</span>';
      } else {
        badge = '<span class="lk-badge lk-st">' + r.status_label + '</span>';
      }
      html += '<div class="lk-event">' +
        '<div class="lk-ev-head"><b>' + r.code + '</b> <span class="lk-ev-name">' + r.name + '</span></div>' +
        '<div class="lk-ev-meta muted">' + (r.dance || '—') + (r.partner ? ' · 搭档 ' + r.partner : '') + '</div>' +
        '<div class="lk-ev-badges">' + badge + '</div>' +
        '</div>';
    });
    html += '</div>';
  }
  html += '<p class="muted" style="margin-top:8px">公示口径：仅姓名、单位、赛程状态与已发布成绩。</p>';
  box.innerHTML = html;
}
document.getElementById('lookup-go').addEventListener('click', doLookup);
document.getElementById('lookup-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLookup(); });
</script>
