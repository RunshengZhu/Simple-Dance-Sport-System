<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>{% block title %}体育舞蹈评分系统{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v=r39">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header>
  <span class="brand">体育舞蹈评分系统</span>
  <nav>
    {% block nav %}{% endblock %}
    <a href="/manual">操作手册</a>
    <span id="net-badge" class="badge" title="实时连接状态">●</span>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>window.CID = {% block cid %}0{% endblock %};</script>
<script src="/static/app.js"></script>
{% if autorefresh %}<script>
/* 输入保护：正在填表时推迟重载类刷新，避免打断（R38 终审 P2） */
function softReloadIfIdle() {
  var ae = document.activeElement;
  var typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' ||
                      ae.tagName === 'SELECT' || ae.isContentEditable);
  if (typing) { setTimeout(softReloadIfIdle, 3000); return; }
  softReload();
}
if (window.CID) { connectSSE('/api/events/' + window.CID + '/stream', {results_published: softReloadIfIdle, competition_event_opened: softReloadIfIdle, competition_event_closed: softReloadIfIdle, schedule_changed: softReloadIfIdle, score_submitted: softReloadIfIdle, calculation_done: softReloadIfIdle, screen_state_changed: softReloadIfIdle, checkin_changed: softReloadIfIdle}, softReloadIfIdle, 8000); }
</script>{% endif %}
<script>
{% block scripts %}{% endblock %}
</script>
</body>
</html>
