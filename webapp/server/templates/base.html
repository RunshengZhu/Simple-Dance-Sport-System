<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ef" id="meta-theme">
<title>{% block title %}体育舞蹈工具箱{% endblock %}</title>
<script>
/* R40 主题防闪烁：CSS 加载前物化主题（localStorage 优先，系统偏好兜底） */
(function () {
  var t = null;
  try { t = localStorage.getItem('ds-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=r67">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header>
  <a href="/" class="brand" title="回到工具箱首页">体育舞蹈工具箱</a>
  <nav>
    {% block nav %}{% endblock %}
    <a href="/manual">操作手册</a>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换深浅配色" title="切换深浅配色"></button>
    <span id="net-badge" class="badge" title="实时连接状态"></span>{# 圆点由 .badge 背景绘制；文本字形会溢出 9px 盒被视口裁切 #}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  {% block footer %}{% endblock %}
  {% block beian %}<p class="beian-line">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2026068150号-1</a>
    <span aria-hidden="true">·</span>
    <a href="https://beian.mps.gov.cn/#/query/webSearch?code=11010802050663" target="_blank" rel="noopener noreferrer">京公网安备11010802050663号</a>
  </p>{% endblock %}
</footer>
<div id="toast-wrap" aria-live="polite"></div>
<script>window.CID = {% block cid %}0{% endblock %};</script>
<script src="/static/app.js"></script>
<script>
/* R40 主题切换：两态循环并持久化；用户未手动选择时跟随系统变化 */
(function () {
  var root = document.documentElement, KEY = 'ds-theme';
  var meta = document.getElementById('meta-theme');
  function paint(t) {
    root.dataset.theme = t;
    if (meta) meta.content = (t === 'dark') ? '#131519' : '#f5f3ef';
  }
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function apply(t, store) {
    paint(t);
    if (store) { try { localStorage.setItem(KEY, t); } catch (e) {} }
  }
  apply(root.dataset.theme === 'dark' ? 'dark' : 'light', false);
  if (window.matchMedia) {
    try {
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!saved()) apply(e.matches ? 'dark' : 'light', false);
      });
    } catch (e) {}
  }
  var btn = document.getElementById('theme-toggle');
  if (btn) btn.onclick = function () {
    root.classList.add('theme-anim');
    apply(root.dataset.theme === 'dark' ? 'light' : 'dark', true);
    setTimeout(function () { root.classList.remove('theme-anim'); }, 320);
  };
})();
</script>
{% if autorefresh %}<script>
/* 输入保护：正在填表时推迟重载类刷新，避免打断（R38 终审 P2） */
function softReloadIfIdle() {
  var ae = document.activeElement;
  var typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' ||
                      ae.tagName === 'SELECT' || ae.isContentEditable);
  var recentCheck = window.__lastCheckAt && (Date.now() - window.__lastCheckAt < 8000);
  if (typing || recentCheck) { setTimeout(softReloadIfIdle, 3000); return; }
  softReload();
}
document.addEventListener('change', function (e) {
  if (e.target && e.target.type === 'checkbox') window.__lastCheckAt = Date.now();
}, true);
if (window.CID && !window.__pageOwnSSE) { connectSSE('/api/events/' + window.CID + '/stream', {results_published: softReloadIfIdle, competition_event_opened: softReloadIfIdle, competition_event_closed: softReloadIfIdle, schedule_changed: softReloadIfIdle, score_submitted: softReloadIfIdle, calculation_done: softReloadIfIdle, screen_state_changed: softReloadIfIdle, checkin_changed: softReloadIfIdle}, softReloadIfIdle, 8000); }
</script>{% endif %}
<script>
{% block scripts %}{% endblock %}
</script>
</body>
</html>
