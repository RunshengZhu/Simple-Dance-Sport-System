# dancesport CI（R150 三层测试体系）
#
# test job（L1 单测 + ASGI 层 API）:
#   - actions/checkout 默认拉取全仓库，core 测试引用的 desktop/src 对照源码
#     （以顶层包名 src 导入）随之就位，无需额外步骤。
#   - 测试无需浏览器、无需外部网络：webapp 测试经 httpx ASGITransport 直连
#     ASGI app；desktop 版重依赖 pandas/appdirs/reportlab 故意不安装，
#     tests/conftest.py 对三者均有垫片，已在无 pandas 环境实测通过
#     （垫片仅在真实包缺失时生效，风险极低，故不 pip install pandas 兜底）。
#
# lint job（快速语法层）:
#   - python -m compileall 对 webapp/server 与 core 做秒级检查，不做风格类 lint。
#
# release-gate job（L2 真实 HTTP 全链路 · 角色动线 A–H）:
#   - webapp/tools/ci.sh：临时库起服 → ci_suite.py（筹备/检录主持/裁判/发布/晋级/
#     公众/打印证书/恢复体检 八条动线，含 comp21 事故回归用例）→ doctor 不变量。
#
# webui job（L3 纯 WebUI 固化动线 · tests-ui/）:
#   - Playwright + Chromium 对自起临时服务器（mktemp 临时库，绝不触生产）按角色
#     动线真实点击；断言页面状态与零 JS 异常。本地跑法见 docs/CI.md。
name: CI

on:
  push:
    branches:
      - main
      - 'feat/*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      # 证书管线用 _reportlab_font() 嵌入中文（生产装 wqy-zenhei）——CI 装同款字体，
      # 使 test_cert_* 的中文文本断言在 CI 真实运行（无字体环境这些测试会 skip）。
      - name: Install CJK font (wqy-zenhei)
        run: sudo apt-get install -y fonts-wqy-zenhei

      - name: Run tests
        run: |
          if python -m pytest -q --tb=short > pytest-out.txt 2>&1; then
            tail -3 pytest-out.txt
          else
            exit 1
          fi


  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check (compileall)
        run: python -m compileall webapp/server core

  release-gate:
    # R134 建，R150 重组为角色动线 A–H（含打印/证书动线——需要 CJK 字体）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CJK font (wqy-zenhei)
        run: sudo apt-get install -y fonts-wqy-zenhei

      - name: Release gate (ci.sh)
        run: bash webapp/tools/ci.sh

  webui:
    # R150 纯 WebUI 动线层：真实浏览器按角色动线点击（自起临时库，不触生产）
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 失败时把测试日志/截图推到 ci-log 分支供远程排查
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ui.txt pytest

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run WebUI flow tests
        run: |
          if python -m pytest tests-ui -q --tb=short > ui-out.txt 2>&1; then
            tail -3 ui-out.txt
          else
            tail -60 ui-out.txt
            exit 1
          fi

      - name: Push test log and screenshots (failure only)
        if: failure()
        run: |
          git config user.name "ci-log"
          git config user.email "ci@noreply"
          git checkout -B ci-log
          git add -f ui-out.txt tests-ui/artifacts/ 2>/dev/null || true
          git commit -m "webui 失败日志（$GITHUB_SHA）" || exit 0
          git push -f origin ci-log
